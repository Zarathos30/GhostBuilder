name: Ghost Kernel Builder

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: "Custom Kernel Name (LOCALVERSION)"
        required: true
        type: string
        default: "-GhostKernel-1.9.5"
      spoof_uname:
        description: "Spoof Uname (SUSFS/Stock Naming)"
        required: true
        type: boolean
        default: false
      clang_variant:
        description: "Clang Toolchain"
        required: true
        type: choice
        options:
          - neutron
          - cirrus
          - weebx
          - zyc
          - aosp
        default: neutron
      hz:
        description: "Refresh Rate (HZ)"
        required: true
        type: choice
        options:
          - powersave
          - balance
          - smooth
          - performance
          - ultra-performance
        default: smooth
      variant:
        description: "Build Variant"
        required: true
        type: choice
        options:
          - stock
          - root
          - susfs
        default: stock
      root:
        description: "Root Method"
        required: true
        type: choice
        options:
          - none
          - ksu-next
          - sukisu
          - bakasu
          - resukisu
        default: sukisu
      lto:
        description: "LTO Mode"
        required: true
        type: choice
        options:
          - full
          - thin
          - none
        default: full
      bypasscharging:
        description: "Bypass Charging (MCA Override)"
        required: true
        type: boolean
        default: true
      droidspaces:
        description: "Droidspaces Support"
        required: true
        type: boolean
        default: false
      kernel_version_spoof:
        description: "Spoof Kernel Version (leave blank to use upstream)"
        required: false
        type: string
        default: ""
      debug:
        description: "Debug Mode (nokaslr, no optimizations)"
        required: true
        type: boolean
        default: false
      nomount:
        description: "NoMount (VFS Path Injection, no mount table)"
        required: true
        type: boolean
        default: false
      kasumi:
        description: "Kasumi (path hiding/spoofing LKM, manual insmod required)"
        required: true
        type: boolean
        default: false
      run_mode:
        description: "Run Mode (Release=pinned only, Test=check upstream)"
        required: true
        type: choice
        options:
          - Release
          - Test
        default: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: "Custom Build"
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4
        with:
          path: builder
          fetch-depth: 0

      - name: Build Kernel (shared pipeline)
        uses: ./builder/.github/actions/build-kernel
        with:
          variant: ${{ inputs.variant }}
          root: ${{ inputs.root }}
          hz: ${{ inputs.hz }}
          clang_variant: ${{ inputs.clang_variant }}
          lto: ${{ inputs.lto }}
          kernel_name: ${{ inputs.kernel_name }}
          spoof_uname: ${{ inputs.spoof_uname }}
          bypasscharging: ${{ inputs.bypasscharging }}
          droidspaces: ${{ inputs.droidspaces }}
          debug: ${{ inputs.debug }}
          nomount: ${{ inputs.nomount }}
          kasumi: ${{ inputs.kasumi }}
          run_mode: ${{ inputs.run_mode }}
          kernel_version_spoof: ${{ inputs.kernel_version_spoof }}
          kernel_clone_token: ${{ secrets.GH_TOKEN }}
          telegram_token: ${{ secrets.TELEGRAM_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          run_inputs_json: ${{ toJSON(inputs) }}
          gh_token: ${{ secrets.GH_TOKEN }}

      - name: Save ccache
        if: always()
        continue-on-error: true
        run: bash builder/scripts/ccache_save.sh

      - name: Publish ccache
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash builder/scripts/merge_ccache.sh "$CCACHE_ASSET" "$CCACHE_OUT_DIR"

      - name: Notify Telegram
        if: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash builder/scripts/notify_telegram.sh

      - name: Notify Failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash builder/scripts/notify_failure.sh

      - name: Upload Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: GhostKernel-${{ env.BUILD_NAME }}
          path: kernel-source/GhostKernel-Release
          retention-days: 1
