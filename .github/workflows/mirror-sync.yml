name: Mirror Sync

on:
  schedule:
    - cron: "17 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: "Sync upstream mirrors"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4
        with:
          path: builder
          fetch-depth: 1

      - name: Sync Mirrors
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash builder/scripts/mirror_sync.sh
